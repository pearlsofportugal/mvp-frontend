<div class="filter-bar" [formGroup]="filterForm">

  <!-- Source -->
  <div class="filter-field">
    <svg class="field-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="2" y="3" width="20" height="14" rx="2"/>
      <path d="M8 21h8M12 17v4"/>
    </svg>
    <app-select-dropdown
      class="field-select"
      formControlName="source_partner"
      placeholder="All sources"
      [options]="sourceOptions()"
    />
  </div>

  <span class="filter-sep" aria-hidden="true"></span>

  <!-- Type -->
  <div class="filter-field">
    <svg class="field-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    <input class="field-input" formControlName="property_type" placeholder="Type…" />
  </div>

  <!-- Typology -->
  <div class="filter-field filter-field--short">
    <svg class="field-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="3" width="7" height="7" rx="1"/>
      <rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/>
      <rect x="14" y="14" width="7" height="7" rx="1"/>
    </svg>
    <input class="field-input" formControlName="typology" placeholder="T2…" />
  </div>

  <!-- Listing type (sale/rent) -->
  <div class="filter-field">
    <svg class="field-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="12" y1="1" x2="12" y2="23"/>
      <path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>
    </svg>
    <app-select-dropdown
      class="field-select"
      formControlName="business_type"
      placeholder="Sale or rent"
      [options]="listingTypeOptions"
    />
  </div>

  <!-- District -->
  <div class="filter-field">
    <svg class="field-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/>
      <circle cx="12" cy="10" r="3"/>
    </svg>
    <input class="field-input" formControlName="district" placeholder="District…" />
  </div>

  <!-- County -->
  <div class="filter-field">
    <svg class="field-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
    </svg>
    <input class="field-input" formControlName="county" placeholder="County…" />
  </div>

  <span class="filter-sep" aria-hidden="true"></span>

  <!-- Price range -->
  <div class="filter-range">
    <div class="filter-field filter-field--short">
      <span class="field-prefix">€</span>
      <input class="field-input field-input--prefix" formControlName="price_min" type="number" placeholder="Min" />
    </div>
    <span class="filter-range-sep">–</span>
    <div class="filter-field filter-field--short">
      <input class="field-input" formControlName="price_max" type="number" placeholder="Max" />
    </div>
  </div>

  <!-- Area range -->
  <div class="filter-range">
    <div class="filter-field filter-field--short">
      <input class="field-input" formControlName="area_min" type="number" placeholder="m² min" />
    </div>
    <span class="filter-range-sep">–</span>
    <div class="filter-field filter-field--short">
      <input class="field-input" formControlName="area_max" type="number" placeholder="m² max" />
    </div>
  </div>

  <!-- Beds range -->
  <div class="filter-range">
    <div class="filter-field filter-field--short">
      <svg class="field-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 00-3-3.87"/>
        <path d="M16 3.13a4 4 0 010 7.75"/>
      </svg>
      <input class="field-input field-input--prefix" formControlName="bedrooms_min" type="number" placeholder="Beds min" />
    </div>
    <span class="filter-range-sep">–</span>
    <div class="filter-field filter-field--short">
      <input class="field-input" formControlName="bedrooms_max" type="number" placeholder="Beds max" />
    </div>
  </div>

  <!-- Baths range -->
  <div class="filter-range">
    <div class="filter-field filter-field--short">
      <svg class="field-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 6 6.5 3.5a1.5 1.5 0 00-2.5 1V12"/>
        <path d="M4 12h18v3a4 4 0 01-4 4H8a4 4 0 01-4-4z"/>
        <line x1="6" y1="19" x2="6" y2="21"/>
        <line x1="18" y1="19" x2="18" y2="21"/>
      </svg>
      <input class="field-input field-input--prefix" formControlName="bathrooms_min" type="number" placeholder="Baths min" />
    </div>
    <span class="filter-range-sep">–</span>
    <div class="filter-field filter-field--short">
      <input class="field-input" formControlName="bathrooms_max" type="number" placeholder="Baths max" />
    </div>
  </div>

  <!-- Energy certificate -->
  <div class="filter-field">
    <svg class="field-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
    </svg>
    <app-select-dropdown
      class="field-select"
      formControlName="energy_certificate"
      placeholder="Any energy class"
      [options]="energyCertificateOptions"
    />
  </div>

  <span class="filter-sep" aria-hidden="true"></span>

  <!-- Amenity toggles -->
  <div class="filter-toggles">
    <label class="toggle-chip">
      <input type="checkbox" formControlName="has_garage" />
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 21V8l9-5 9 5v13"/>
        <path d="M3 11h18"/>
        <path d="M7 21v-6h10v6"/>
      </svg>
      <span>Garage</span>
    </label>

    <label class="toggle-chip">
      <input type="checkbox" formControlName="has_pool" />
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 12h20"/>
        <path d="M2 17c1.5 1.3 3 1.3 4.5 0s3-1.3 4.5 0 3 1.3 4.5 0 3-1.3 4.5 0"/>
        <path d="M5 12V6a2 2 0 012-2h10a2 2 0 012 2v6"/>
      </svg>
      <span>Pool</span>
    </label>

    <label class="toggle-chip">
      <input type="checkbox" formControlName="has_elevator" />
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4" y="2" width="16" height="20" rx="2"/>
        <polyline points="10 8 12 6 14 8"/>
        <polyline points="10 16 12 18 14 16"/>
      </svg>
      <span>Elevator</span>
    </label>

    <label class="toggle-chip">
      <input type="checkbox" formControlName="has_balcony" />
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 21V9l9-6 9 6v12"/>
        <line x1="3" y1="15" x2="21" y2="15"/>
      </svg>
      <span>Balcony</span>
    </label>
  </div>

  <span class="filter-sep filter-sep--push" aria-hidden="true"></span>

  <!-- AI Enrichment -->
  <div class="filter-field">
    <svg class="field-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 2a2 2 0 012 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 017 7h1a1 1 0 010 2h-1v1a2 2 0 01-2 2H5a2 2 0 01-2-2v-1H2a1 1 0 010-2h1a7 7 0 017-7h1V5.73A2 2 0 0110 4a2 2 0 012-2z"/>
    </svg>
    <app-select-dropdown
      class="field-select"
      formControlName="is_enriched"
      placeholder="AI status"
      [options]="enrichedOptions"
    />
  </div>

  <!-- Imodigi Export -->
  <div class="filter-field">
    <svg class="field-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="16 16 12 12 8 16"/>
      <line x1="12" y1="12" x2="12" y2="21"/>
      <path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/>
    </svg>
    <app-select-dropdown
      class="field-select"
      formControlName="is_exported_to_imodigi"
      placeholder="Imodigi"
      [options]="imodigiOptions"
    />
  </div>

  <!-- Actions -->
  <div class="filter-actions">
    <button class="btn btn-primary btn-sm" type="button" (click)="onSearch()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      Search
    </button>
    <button class="btn btn-ghost btn-sm" type="button" (click)="onClearFilters()">Clear</button>
  </div>

</div>
