<form class="filters" [formGroup]="filterForm" (ngSubmit)="onSearch()" role="search" aria-label="Filtrar anúncios">

  <div class="filters-grid">

    <div class="field">
      <label class="field-label" for="f-source">Site de origem</label>
      <app-select-dropdown
        id="f-source"
        formControlName="source_partner"
        placeholder="Todos os sites"
        [options]="sourceOptions()"
      />
    </div>

    <div class="field">
      <label class="field-label" for="f-type">Tipo de imóvel</label>
      <app-select-dropdown
        id="f-type"
        formControlName="property_type"
        placeholder="Todos os tipos"
        [options]="propertyTypeOptions()"
      />
    </div>

    <div class="field">
      <label class="field-label" for="f-district">Distrito</label>
      <app-select-dropdown
        id="f-district"
        formControlName="district"
        placeholder="Todos os distritos"
        [options]="districtOptions()"
      />
    </div>

    <div class="field">
      <label class="field-label" for="f-county">Concelho</label>
      <input id="f-county" class="field-input" formControlName="county" placeholder="ex.: Cascais" />
    </div>

    <div class="field field--range">
      <span class="field-label" id="f-price-label">Preço (€)</span>
      <div class="range" role="group" aria-labelledby="f-price-label">
        <input class="field-input" formControlName="price_min" type="number" min="0" placeholder="Mín." aria-label="Preço mínimo" />
        <span class="range-sep" aria-hidden="true">–</span>
        <input class="field-input" formControlName="price_max" type="number" min="0" placeholder="Máx." aria-label="Preço máximo" />
      </div>
    </div>

    <div class="field field--narrow">
      <label class="field-label" for="f-beds">Quartos</label>
      <input id="f-beds" class="field-input" formControlName="bedrooms" type="number" min="0" placeholder="Nº" />
    </div>

    <div class="field">
      <label class="field-label" for="f-ai">Enriquecimento IA</label>
      <app-select-dropdown
        id="f-ai"
        formControlName="is_enriched"
        placeholder="Todos"
        [options]="enrichedOptions"
      />
    </div>

    <div class="field">
      <label class="field-label" for="f-imodigi">Publicação no Imodigi</label>
      <app-select-dropdown
        id="f-imodigi"
        formControlName="is_exported_to_imodigi"
        placeholder="Todos"
        [options]="imodigiOptions"
      />
    </div>

  </div>

  <div class="filters-footer">
    <ul class="chips" aria-label="Filtros aplicados">
      @for (chip of chips(); track chip.key) {
        <li class="chip">
          <span class="chip-text"><span class="chip-label">{{ chip.label }}:</span> {{ chip.value }}</span>
          <button type="button" class="chip-remove" (click)="removeChip(chip.key)"
            [attr.aria-label]="'Remover filtro ' + chip.label">×</button>
        </li>
      } @empty {
        <li class="chips-empty">Sem filtros aplicados — a mostrar todos os anúncios.</li>
      }
    </ul>

    <div class="filter-actions">
      @if (chips().length > 0) {
        <button class="btn btn-ghost btn-sm" type="button" (click)="onClearFilters()">Limpar filtros</button>
      }
      <button class="btn btn-primary btn-sm" type="submit">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
        Aplicar filtros
      </button>
    </div>
  </div>

</form>
