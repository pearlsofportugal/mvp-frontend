<form [formGroup]="form">
  <div class="form-grid">
    <div class="form-group">
      <label for="district">Distrito</label>
      <select id="district" formControlName="district">
        <option value="">Todos</option>
        @for (d of districts(); track d) { <option [value]="d">{{ d }}</option> }
      </select>
    </div>

    <div class="form-group">
      <label for="county">Concelho</label>
      <input type="text" id="county" formControlName="county" placeholder="ex.: Cascais" />
    </div>

    <div class="form-group">
      <label for="property_type">Tipo de imóvel</label>
      <select id="property_type" formControlName="property_type">
        <option value="">Todos</option>
        @for (t of propertyTypes(); track t) { <option [value]="t">{{ t }}</option> }
      </select>
    </div>

    <div class="form-group">
      <label for="source_partner">Site de origem</label>
      <select id="source_partner" formControlName="source_partner">
        <option value="">Todos</option>
        @for (p of partners(); track p) { <option [value]="p">{{ p }}</option> }
      </select>
    </div>

    <div class="form-group">
      <label for="price_min">Preço mínimo (€)</label>
      <input type="number" id="price_min" formControlName="price_min" placeholder="0" />
    </div>

    <div class="form-group">
      <label for="price_max">Preço máximo (€)</label>
      <input type="number" id="price_max" formControlName="price_max" placeholder="500 000" />
    </div>
  </div>
</form>
